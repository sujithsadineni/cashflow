name: Tests and demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: API tests (pg-mem, no database needed)
        working-directory: api
        run: npm ci && npm test
      - name: Web tests
        working-directory: web
        run: npm ci && npm test
      - name: Leak-scan self-tests, and the scan itself (shape and secret checks)
        run: node --test scripts/ && node scripts/leak-scan.mjs --dir .

  # The GitHub Pages demo: the web app built in replay mode (see README → The demo).
  pages:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: web
        run: npm ci && npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
