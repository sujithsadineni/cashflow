         flashes white (D234). Mirrors design-context.jsx; the demo build

      try {
        var d = localStorage.getItem('cashflow_design') || ('1' === '1' ? 'glass' : 'vivid');
        var a = localStorage.getItem('cashflow_appearance') || 'system';
        var dark = a === 'dark' || (a === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.design = d;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
